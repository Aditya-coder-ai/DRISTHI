name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-build:
    name: Static Checks & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies and linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Python syntax and undefined-name checks (Ruff)
        run: ruff check --select E9,F63,F7,F82 backend/ collector/ services/ shared/

      - name: Verify FastAPI application import and OpenAPI schema generation
        env:
          PYTHONPATH: .
          DISABLE_SQLALCHEMY_CEXT: "1"
        run: |
          python -c "from backend.app.main import app; schema = app.openapi(); assert '/api/health' in schema['paths']; print('OpenAPI paths verified:', len(schema['paths']))"

  backend-tests:
    name: Central Backend & Migration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend test suite
        env:
          PYTHONPATH: .
          DISABLE_SQLALCHEMY_CEXT: "1"
        run: pytest backend/tests/ -v --tb=short

  deception-tests:
    name: Deception Services & Collector Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deception infrastructure test suite
        env:
          PYTHONPATH: .
          DISABLE_SQLALCHEMY_CEXT: "1"
        run: pytest tests/ -v --tb=short

  docker-validate:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: drishti:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
