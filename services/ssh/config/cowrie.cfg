# =====================================================================
# Cowrie SSH Honeypot Configuration for Deception Platform
# Asset ID: ssh-001 | Hostname: finance-server
# =====================================================================

[honeypot]
hostname = finance-server
backend = shell
auth_class = UserDB
etc_path = services/ssh/config
contents_path = services/ssh/honeyfs
interactive_timeout = 300
authentication_timeout = 120
timezone = UTC
download_limit_size = 10485760

[shell]
filesystem = services/ssh/fs.pickle 

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
sftp_enabled = true
forwarding = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false
